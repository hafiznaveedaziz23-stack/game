<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RUNNING RUSH 3D - BALI</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00c6ff">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#000;font-family:Arial,sans-serif;touch-action:none}
#gameCanvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#loading{position:fixed;inset:0;background:linear-gradient(180deg,#00c6ff,#0072ff);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;color:#fff;text-align:center;padding:20px}
#loading h1{font-size:32px}
#barWrap{width:80%;max-width:320px;height:18px;background:rgba(255,255,255,.3);border-radius:20px;margin-top:18px;overflow:hidden}
#bar{height:100%;width:0%;background:#ffde59;border-radius:20px}
#hud{position:fixed;top:12px;left:12px;right:12px;display:none;justify-content:space-between;z-index:10;color:#fff;font-weight:bold}
#hud div{background:rgba(0,0,0,.45);padding:8px 14px;border-radius:20px}
#menu{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:20;background:linear-gradient(180deg,rgba(0,198,255,.9),rgba(0,114,255,.9));color:#fff;text-align:center;padding:20px}
.btn{background:#ffde59;color:#000;border:none;padding:14px 32px;font-size:18px;font-weight:900;border-radius:30px;margin:6px;min-width:220px}
.btn2{background:#fff}
#gameOver{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:30;background:rgba(0,0,0,.75);color:#fff;text-align:center}
#hint{position:fixed;bottom:18px;left:0;right:0;text-align:center;color:#fff;z-index:10;display:none}
</style>
</head>
<body>
<div id="loading"><div style="font-size:60px">🏝️</div><h1>RUNNING RUSH 3D</h1><p>BALI • SWIPE TO RUN</p><div id="barWrap"><div id="bar"></div></div><div id="loadText">Loading... 0%</div></div>
<canvas id="gameCanvas"></canvas>
<div id="hud"><div>Score: <span id="score">0</span></div><div>🪙 <span id="coins">0</span> ❤️ <span id="lives">3</span></div></div>
<div id="menu"><div style="font-size:60px">🏝️</div><h1>RUNNING<br>RUSH 3D</h1><p>BALI ADVENTURE • OFFLINE READY</p><button class="btn" onclick="startGame()">▶ PLAY NOW</button><button class="btn btn2" onclick="alert('Swipe Left/Right = Move, Swipe Up = Jump, Swipe Down = Slide')">❓ HOW TO PLAY</button></div>
<div id="gameOver"><h2>GAME OVER!</h2><div id="scoreBig">Score: 0</div><br><button class="btn" onclick="startGame()">🔄 PLAY AGAIN</button><button class="btn btn2" onclick="showMenu()">🏠 MENU</button></div>
<div id="hint">⬅️ Swipe • ⬆️ Jump • ⬇️ Slide</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
let scene,camera,renderer,player,clock,lanes=[-2.2,0,2.2],lane=1,isJumping=false,vy=0,obstacles=[],coinsArr=[],speed=0.22,score=0,coinCount=0,lives=3,playing=false;
let bar=document.getElementById('bar'),loadText=document.getElementById('loadText'),p=0;
let t=setInterval(()=>{p+=Math.floor(Math.random()*18)+8;if(p>=100){p=100;clearInterval(t);setTimeout(finish,300);}bar.style.width=p+'%';loadText.textContent='Loading... '+p+'%';},120);
function finish(){document.getElementById('loading').style.display='none';document.getElementById('menu').style.display='flex';init3D();}
function showMenu(){document.getElementById('gameOver').style.display='none';document.getElementById('menu').style.display='flex';document.getElementById('hud').style.display='none';document.getElementById('hint').style.display='none';playing=false;}
function init3D(){scene=new THREE.Scene();scene.background=new THREE.Color(0x87ceeb);scene.fog=new THREE.Fog(0x87ceeb,18,55);camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.1,100);camera.position.set(0,4.2,7.5);renderer=new THREE.WebGLRenderer({canvas:document.getElementById('gameCanvas'),antialias:true});renderer.setSize(innerWidth,innerHeight);scene.add(new THREE.AmbientLight(0xffffff,0.7));let sun=new THREE.DirectionalLight(0xffffff,1);sun.position.set(5,10,5);scene.add(sun);let road=new THREE.Mesh(new THREE.BoxGeometry(8,0.2,120),new THREE.MeshLambertMaterial({color:0x444444}));road.position.set(0,-0.1,-40);scene.add(road);let left=new THREE.Mesh(new THREE.BoxGeometry(20,0.1,120),new THREE.MeshLambertMaterial({color:0x2ecc71}));left.position.set(-14,-0.15,-40);scene.add(left);let right=left.clone();right.position.x=14;right.material=new THREE.MeshLambertMaterial({color:0xf1c40f});scene.add(right);player=new THREE.Group();let body=new THREE.Mesh(new THREE.BoxGeometry(0.8,1.1,0.5),new THREE.MeshLambertMaterial({color:0xff4757}));body.position.y=0.9;player.add(body);let head=new THREE.Mesh(new THREE.BoxGeometry(0.6,0.6,0.6),new THREE.MeshLambertMaterial({color:0xffd8a8}));head.position.y=1.75;player.add(head);player.position.set(0,0,0);scene.add(player);clock=new THREE.Clock();animate();let sx=0,sy=0;document.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});document.addEventListener('touchend',e=>{if(!playing)return;let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>Math.abs(dy)){if(dx>30&&lane<2)lane++;if(dx<-30&&lane>0)lane--;}else{if(dy<-30&&!isJumping){isJumping=true;vy=0.22;}}},{passive:true});}
function spawn(){if(Math.random()<0.6){let l=Math.floor(Math.random()*3);let o=new THREE.Mesh(new THREE.BoxGeometry(1.2,1.2,1.2),new THREE.MeshLambertMaterial({color:0x2f3542}));o.position.set(lanes[l],0.6,-55);scene.add(o);obstacles.push(o);}else{let l=Math.floor(Math.random()*3);let c=new THREE.Mesh(new THREE.CylinderGeometry(0.35,0.35,0.15,16),new THREE.MeshLambertMaterial({color:0xffde59}));c.rotation.x=Math.PI/2;c.position.set(lanes[l],0.9,-55);scene.add(c);coinsArr.push(c);}}
let frame=0;function animate(){requestAnimationFrame(animate);if(!scene)return;if(playing){frame++;if(frame%28===0)spawn();speed=Math.min(0.45,0.22+score/4000);player.position.x+=(lanes[lane]-player.position.x)*0.18;if(isJumping){player.position.y+=vy;vy-=0.015;if(player.position.y<=0){player.position.y=0;isJumping=false;}}for(let i=obstacles.length-1;i>=0;i--){let o=obstacles[i];o.position.z+=speed*3;if(o.position.z>8){scene.remove(o);obstacles.splice(i,1);score+=10;}else if(Math.abs(o.position.z)<0.9&&Math.abs(o.position.x-player.position.x)<0.9&&player.position.y<0.9){lives--;scene.remove(o);obstacles.splice(i,1);if(lives<=0){playing=false;document.getElementById('gameOver').style.display='flex';document.getElementById('scoreBig').textContent='Score: '+Math.floor(score)+' | Coins: '+coinCount;}}}}for(let i=coinsArr.length-1;i>=0;i--){let c=coinsArr[i];c.position.z+=speed*3;if(c.position.z>8){scene.remove(c);coinsArr.splice(i,1);}else if(Math.abs(c.position.z)<0.9&&Math.abs(c.position.x-player.position.x)<0.9){coinCount++;score+=50;scene.remove(c);coinsArr.splice(i,1);}}score+=0.3;document.getElementById('score').textContent=Math.floor(score);document.getElementById('coins').textContent=coinCount;document.getElementById('lives').textContent=lives;}camera.position.x=player?player.position.x*0.5:0;camera.lookAt(player?player.position.x:0,1.5,-10);if(renderer)renderer.render(scene,camera);}
function startGame(){score=0;coinCount=0;lives=3;lane=1;playing=true;obstacles.forEach(o=>scene.remove(o));obstacles=[];coinsArr.forEach(c=>scene.remove(c));coinsArr=[];if(player)player.position.set(0,0,0);document.getElementById('menu').style.display='none';document.getElementById('gameOver').style.display='none';document.getElementById('hud').style.display='flex';document.getElementById('hint').style.display='block';}
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
</script>
</body>
  </html>
