<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>RUNNING RUSH 3D - BALI</title>
<link rel="manifest" href="manifest.json">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#00c6ff;font-family:Arial;overflow:hidden}
#loading{position:fixed;inset:0;background:linear-gradient(#00c6ff,#0072ff);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;z-index:99}
#barWrap{width:80%;height:20px;background:rgba(255,255,255,.4);border-radius:20px;margin-top:15px;overflow:hidden}
#bar{height:100%;width:0%;background:#ffde59}
#menu{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(#00c6ff,#0072ff);color:#fff;z-index:90}
.btn{background:#ffde59;border:none;padding:15px 30px;font-size:19px;font-weight:900;border-radius:30px;margin:8px;min-width:230px}
#game{position:fixed;inset:0;display:none;background:#87ceeb}
canvas{width:100%;height:100%;display:block}
#hud{position:fixed;top:10px;left:10px;right:10px;display:none;justify-content:space-between;color:#fff;font-weight:bold;z-index:20}
#hud div{background:rgba(0,0,0,.5);padding:8px 14px;border-radius:20px}
</style>
</head>
<body>
<div id="loading"><div style="font-size:70px">🏝️</div><h1>RUNNING RUSH 3D</h1><p>BALI • SWIPE TO RUN</p><div id="barWrap"><div id="bar"></div></div><div id="loadText" style="margin-top:10px;font-weight:bold">Loading... 0%</div></div>
<div id="menu"><div style="font-size:70px">🏝️</div><h1 style="font-size:36px;text-align:center">RUNNING<br>RUSH 3D</h1><p style="margin:10px">BALI ADVENTURE - 100% OFFLINE</p><button class="btn" onclick="startGame()">▶ PLAY NOW</button><button class="btn" style="background:#fff" onclick="alert('Swipe Left/Right = Move, Swipe Up = Jump')">❓ HOW TO PLAY</button></div>
<div id="game"><canvas id="cv"></canvas></div>
<div id="hud"><div>Score: <span id="score">0</span></div><div>🪙 <span id="coins">0</span></div></div>
<script>
// 100% OFFLINE GAME - KOI CDN NAHI, IS LIYE 0% PAR NAHI ATKEGA
let bar=document.getElementById('bar'),txt=document.getElementById('loadText'),p=0;
let timer=setInterval(()=>{
  p+=10;
  if(p>100) p=100;
  bar.style.width=p+'%'; txt.textContent='Loading... '+p+'%';
  if(p>=100){ clearInterval(timer); document.getElementById('loading').style.display='none'; document.getElementById('menu').style.display='flex'; }
},100);

let cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let playing=false,score=0,coinCount=0,playerY=0,vy=0,jumping=false,lane=1,obs=[],coins=[],frame=0;
function resize(){cv.width=innerWidth;cv.height=innerHeight;} addEventListener('resize',resize); resize();
function startGame(){
  score=0;coinCount=0;lane=1;obs=[];coins=[];playing=true;
  document.getElementById('menu').style.display='none';
  document.getElementById('game').style.display='block';
  document.getElementById('hud').style.display='flex';
  loop();
}
function spawn(){
  if(Math.random()<0.6) obs.push({x:cv.width,lane:Math.floor(Math.random()*3),w:50,h:50});
  else coins.push({x:cv.width,lane:Math.floor(Math.random()*3)});
}
function loop(){
  if(!playing) return;
  requestAnimationFrame(loop);
  frame++; if(frame%40===0) spawn();
  ctx.fillStyle='#87ceeb'; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.fillStyle='#2ecc71'; ctx.fillRect(0,cv.height-100,cv.width,100);
  ctx.fillStyle='#444'; ctx.fillRect(0,cv.height-120,cv.width,20);
  let lanesX=[cv.width*0.25,cv.width*0.5,cv.width*0.75];
  let px=lanesX[lane];
  if(jumping){ playerY+=vy; vy+=1.2; if(playerY>=0){playerY=0;jumping=false;} }
  // player
  ctx.fillStyle='#ff4757'; ctx.fillRect(px-20,cv.height-140+playerY,40,50);
  ctx.fillStyle='#ffd8a8'; ctx.fillRect(px-15,cv.height-170+playerY,30,30);
  // obstacles
  for(let i=obs.length-1;i>=0;i--){ let o=obs[i]; o.x-=7; ctx.fillStyle='#2f3542'; ctx.fillRect(o.x,cv.height-140,50,50);
    if(Math.abs(o.x-px)<35 && playerY>-40){ alert('GAME OVER! Score: '+Math.floor(score)); playing=false; document.getElementById('game').style.display='none'; document.getElementById('hud').style.display='none'; document.getElementById('menu').style.display='flex'; return; }
    if(o.x<-60){obs.splice(i,1); score+=10;}
  }
  for(let i=coins.length-1;i>=0;i--){ let c=coins[i]; c.x-=7; ctx.fillStyle='#ffde59'; ctx.beginPath(); ctx.arc(c.x,cv.height-110,15,0,7); ctx.fill();
    if(Math.abs(c.x-px)<30){coinCount++; score+=50; coins.splice(i,1);}
    if(c.x<-30) coins.splice(i,1);
  }
  score+=0.2;
  document.getElementById('score').textContent=Math.floor(score);
  document.getElementById('coins').textContent=coinCount;
}
let sx=0,sy=0;
document.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
document.addEventListener('touchend',e=>{if(!playing)return;let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>Math.abs(dy)){if(dx>25&&lane<2)lane++;if(dx<-25&&lane>0)lane--;}else if(dy<-25&&!jumping){jumping=true;vy=-18;}}, {passive:true});
</script>
</body>
</html>
